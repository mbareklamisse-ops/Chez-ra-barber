<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte Fidélité - Chez R&A Barber</title>

<style>
body{
background:#111;
color:white;
font-family:Arial,sans-serif;
text-align:center;
padding:30px;
}

h1{
color:#d4af37;
}

.carte{
max-width:500px;
margin:auto;
padding:30px;
border:2px solid #d4af37;
border-radius:20px;
}

.qr{
margin:25px 0;
}

.qr img{
width:220px;
border-radius:10px;
background:white;
padding:10px;
}

.points{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
margin-top:20px;
}

.point{
border:2px solid #d4af37;
padding:15px;
border-radius:10px;
font-weight:bold;
}

.offert{
background:#d4af37;
color:black;
}
</style>
</head>

<body>

<div class="carte">

<h1>Carte Fidélité</h1>

<h2>Chez R&A Barber</h2>

<p>Après 9 prestations, la 10ème est offerte.</p>

<div class="qr">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://jovial-snickerdoodle-dce0d7.netlify.app/fidelite.html">
</div>

<div class="points">
<div class="point">1</div>
<div class="point">2</div>
<div class="point">3</div>
<div class="point">4</div>
<div class="point">5</div>
<div class="point">6</div>
<div class="point">7</div>
<div class="point">8</div>
<div class="point">9</div>
<div class="point offert">🎁</div>
</div>

<p style="margin-top:20px;">
Scannez le QR Code pour accéder à votre carte fidélité.
</p>

</div>

</body>
</html>
